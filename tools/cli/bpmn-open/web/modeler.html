<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>BPMN</title>
<link rel="stylesheet" href="/bpmn-js/assets/diagram-js.css">
<link rel="stylesheet" href="/bpmn-js/assets/bpmn-js.css">
<link rel="stylesheet" href="/bpmn-js/assets/bpmn-font/css/bpmn.css">
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  #bar { display: flex; gap: .6em; align-items: center; height: 40px; padding: 0 .6em; border-bottom: 1px solid #ccc; box-sizing: border-box; }
  #bar button { padding: .25em .8em; white-space: nowrap; flex: none; }
  #name { font-weight: bold; white-space: nowrap; }
  #status { color: #555; font-size: .9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.error { color: #b00; }
  #canvas { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; }
</style>
</head>
<body>
<div id="bar">
  <span id="name"></span>
  <button id="save" title="Cmd+S">保存</button>
  <button id="reload">ファイルから読み直す</button>
  <span id="status"></span>
</div>
<div id="canvas"></div>
<script src="/bpmn-js/bpmn-modeler.development.js"></script>
<script>
  // bpmn-open のサーバーから BPMN を読み、保存でそのファイルへ書き戻す。
  // トークンは URL の # の後ろにあり、サーバーへのリクエストに付けないと読み書きできない。
  const token = location.hash.slice(1);
  const modeler = new BpmnJS({ container: '#canvas', keyboard: { bindTo: window } });
  const statusEl = document.getElementById('status');
  let mtime = '0';
  let dirty = false;

  const EMPTY = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL"
  xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI"
  xmlns:dc="http://www.omg.org/spec/DD/20100524/DC"
  id="Definitions_1" targetNamespace="http://bpmn.io/schema/bpmn">
  <bpmn:process id="Process_1" isExecutable="false">
    <bpmn:startEvent id="StartEvent_1" />
  </bpmn:process>
  <bpmndi:BPMNDiagram id="BPMNDiagram_1">
    <bpmndi:BPMNPlane id="BPMNPlane_1" bpmnElement="Process_1">
      <bpmndi:BPMNShape id="StartEvent_1_di" bpmnElement="StartEvent_1">
        <dc:Bounds x="180" y="160" width="36" height="36" />
      </bpmndi:BPMNShape>
    </bpmndi:BPMNPlane>
  </bpmndi:BPMNDiagram>
</bpmn:definitions>`;

  function show(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = isError ? 'error' : '';
  }

  function setDirty(value) {
    dirty = value;
    document.title = (dirty ? '● ' : '') + document.getElementById('name').textContent;
  }

  // タブが裏にあるなど表示領域の大きさが 0 のうちは画面に合わせられないので、大きさが付くまで待つ
  function fitWhenSized() {
    const el = document.getElementById('canvas');
    const fit = () => { try { modeler.get('canvas').zoom('fit-viewport'); } catch { /* 等倍のまま */ } };
    if (el.clientWidth && el.clientHeight) return fit();
    const ro = new ResizeObserver(() => {
      if (el.clientWidth && el.clientHeight) { ro.disconnect(); fit(); }
    });
    ro.observe(el);
  }

  async function api(method, body) {
    const res = await fetch('/api/diagram', {
      method,
      body,
      headers: { 'X-Bpmn-Open-Token': token, 'X-Bpmn-Open-Mtime': mtime },
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    return res.json();
  }

  async function load() {
    if (dirty && !confirm('保存していない変更を捨てて、ファイルから読み直しますか？')) return;
    try {
      const data = await api('GET');
      document.getElementById('name').textContent = data.name;
      document.getElementById('name').title = data.path;
      mtime = data.mtime;
      const { warnings } = await modeler.importXML(data.xml || EMPTY);
      fitWhenSized();
      setDirty(false);
      const notes = [];
      if (!data.xml) notes.push('空のファイルなので新規の図で始めた');
      if (data.laidOut) notes.push('座標が無かったので自動で配置した（保存すると座標が書き込まれる。レーンとプールは描かれない）');
      if (warnings.length) notes.push(`読み込みの警告 ${warnings.length} 件`);
      show(notes.join('。') || '読み込んだ');
    } catch (err) {
      show(`読み込めない: ${err.message}`, true);
    }
  }

  async function save() {
    try {
      const { xml } = await modeler.saveXML({ format: true });
      ({ mtime } = await api('PUT', xml));
      setDirty(false);
      show(`保存した（${new Date().toLocaleTimeString()}）`);
    } catch (err) {
      show(err.message.startsWith('409')
        ? '保存していない。ファイルが外で変更されている。「ファイルから読み直す」で取り込んでから直す'
        : `保存できない: ${err.message}`, true);
    }
  }

  modeler.on('commandStack.changed', () => setDirty(true));
  document.getElementById('save').onclick = save;
  document.getElementById('reload').onclick = load;
  window.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); }
  });
  window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });

  load();
</script>
</body>
</html>
